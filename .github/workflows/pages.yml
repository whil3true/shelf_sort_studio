name: Deploy dev to GitHub Pages

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: shelf-pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: release
        uses: actions/deploy-pages@v4
